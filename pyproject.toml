[project]
name = "job-radar"
version = "0.2.1"
description = "Daily job-posting radar: collect, prefilter, score, deliver"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["radar", "radar.collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
