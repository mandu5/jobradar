<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>잡 레이더</title>
<style>
  :root{
    --page:#faf9f6; --ink:#16161a; --muted:#6b6b73; --line:#e2dfd8;
    --card:#fff; --accent:#8c2f24; --urgent:#8c2f24; --ok:#2c6e49;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--page:#0e0e11;--ink:#e8e6e1;--muted:#8f8f99;--line:#26262b;--card:#151519;--accent:#e0705f;--urgent:#e0705f;--ok:#6fbf8f}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:920px;margin:0 auto;padding:28px 18px 80px}

  header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
  h1{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;font-family:var(--mono)}
  .stamp{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .counts{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-family:var(--mono);font-size:12px}
  .counts b{font-size:21px;font-weight:700;display:block;line-height:1.1}
  .counts span{color:var(--muted)}
  .cta{display:inline-block;margin-top:18px;background:var(--ink);color:var(--page);
       padding:10px 16px;border-radius:7px;text-decoration:none;font-weight:700;font-size:14px}
  .cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:8px}

  h2{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
     color:var(--muted);margin:38px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  h2 em{font-style:normal;color:var(--accent)}

  .row{display:block;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
  .row:last-child{border-bottom:0}
  .row:hover .t{text-decoration:underline}
  .co{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
  .t{font-weight:650;font-size:15px;margin:2px 0 6px;display:block}
  .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
  .tag.hot{border-color:var(--urgent);color:var(--urgent);font-weight:700}
  .tag.sc{border-color:var(--ok);color:var(--ok);font-weight:700}
  .why{font-size:13px;color:var(--muted);margin-top:6px}

  .fx{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .fx:last-child{border-bottom:0}
  .dd{font-family:var(--mono);font-weight:700;font-size:14px;min-width:62px;color:var(--muted)}
  .dd.hot{color:var(--urgent)}
  .fx .b{flex:1;min-width:0}
  .warn{color:var(--accent);font-family:var(--mono);font-size:11px}

  .empty{color:var(--muted);font-size:14px;padding:14px 0}
  .banner{border:1px solid var(--accent);border-radius:8px;padding:13px 15px;margin:18px 0;
          color:var(--accent);font-size:14px;line-height:1.5}
  details{margin-top:40px;font-size:12px;color:var(--muted);font-family:var(--mono)}
  summary{cursor:pointer;padding:8px 0}
  pre{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.6}
  footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
         font-family:var(--mono);font-size:11px;color:var(--muted)}
  footer a{color:var(--muted)}
  @media(max-width:520px){.wrap{padding:20px 14px 60px}.counts{gap:11px}.counts b{font-size:18px}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">불러오는 중…</p></div>

<script>
// Point these at your own tracker page and fork.
const NOTION = "https://www.notion.so/";
const REPO   = "https://github.com/OWNER/REPO";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dday(deadline, today){
  if(!deadline) return null;
  const d = new Date(deadline + "T00:00:00"), t = new Date(today + "T00:00:00");
  if(isNaN(d)) return null;
  return Math.round((d - t) / 86400000);
}

function deadlineTag(deadline, today){
  const n = dday(deadline, today);
  if(n === null) return `<span class="tag">상시</span>`;
  if(n < 0)  return `<span class="tag">마감 지남</span>`;
  const hot = n <= 14 ? " hot" : "";
  return `<span class="tag${hot}">D-${n} · ${esc(deadline.slice(5))}</span>`;
}

function jobRow(j, today, showWhy = true){
  return `<a class="row" href="${esc(j.url || "#")}" target="_blank" rel="noopener">
    <span class="co">${esc(j.company || "")}</span>
    <span class="t">${esc(j.title || "")}</span>
    <span class="meta">
      ${deadlineTag(j.deadline, today)}
      ${j.score != null ? `<span class="tag sc">${esc(j.score)}점</span>` : ""}
      ${j.scope ? `<span class="tag">${esc(j.scope)}</span>` : ""}
    </span>
    ${showWhy && j.reason ? `<span class="why">${esc(j.reason)}</span>` : ""}
  </a>`;
}

function section(title, note, rows, emptyText){
  return `<h2>${esc(title)}${note ? ` <em>${esc(note)}</em>` : ""}</h2>`
       + (rows.length ? rows.join("") : `<p class="empty">${esc(emptyText)}</p>`);
}

function render(d){
  const today = d.generated, c = d.counts || {};
  const banner = (!c.A && !c.B && !c.contests)
    ? (d.collected
        ? `<div class="banner"><b>채점이 실행되지 않았다.</b> 오늘 ${d.collected}건을 수집했지만 등급이 매겨진 공고가 0건이다. 목록이 빈 것은 공고가 없어서가 아니다.</div>`
        : `<div class="banner"><b>수집이 실행되지 않았다.</b> 오늘 후보 공고가 0건이다. collect 워크플로를 확인할 것.</div>`)
    : "";

  const fixed = (d.fixed || []).map(f => {
    const hot = f.days_left <= 14 ? " hot" : "";
    const t = f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>` : esc(f.title);
    return `<div class="fx">
      <span class="dd${hot}">D-${esc(f.days_left)}</span>
      <span class="b"><b>${t}</b>
        ${f.verified === false ? ` <span class="warn">날짜 확인 필요</span>` : ""}
        <div class="why">${esc(f.track || "")} · ${esc(f.note || "")}</div></span>
    </div>`;
  });

  document.getElementById("app").innerHTML = `
    <header>
      <h1>잡 레이더</h1>
      <div class="stamp">${esc(today)} 갱신</div>
      <div class="counts">
        <span><b>${c.A ?? 0}</b>A등급</span>
        <span><b>${c.B ?? 0}</b>B등급</span>
        <span><b>${c.upcoming ?? 0}</b>마감임박</span>
        <span><b>${c.contests ?? 0}</b>대회</span>
        <span><b>${(d.fixed || []).length}</b>고정마감</span>
      </div>
      <a class="cta" href="${NOTION}" target="_blank" rel="noopener">Notion에서 승인 →</a>
      <a class="cta ghost" href="${REPO}" target="_blank" rel="noopener">저장소</a>
    </header>
    ${banner}
    ${section("고정 마감", "대학원 · 비자 · 장학금 · 추천서", fixed, "60일 안에 걸린 고정 마감이 없다.")}
    ${(d.upcoming || []).length ? section("마감 임박", "아직 지원하지 않은 A·B",
        d.upcoming.map(j => jobRow(j, today)), "") : ""}
    ${section("A등급", "지원 준비 시작", (d.a || []).map(j => jobRow(j, today)),
        "오늘 A등급으로 올라온 공고가 없다.")}
    ${section("B등급", "검토", (d.b || []).map(j => jobRow(j, today, false)), "없음.")}
    ${section("대회 · 해커톤", "", (d.contests || []).map(j => jobRow(j, today)),
        "참가할 만한 대회가 없다.")}
    <details><summary>수집 상태</summary><pre>${esc(JSON.stringify(d.health, null, 1))}</pre></details>
    <footer>매일 08:30 KST에 <code>job-radar-daily</code> 루틴이 갱신한다.
      개인정보는 이 페이지에 싣지 않는다 — 이력·연락처·지원서는 비공개 저장소와 Notion에만 있다.</footer>`;
}

fetch("radar.json?" + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(render)
  .catch(e => {
    document.getElementById("app").innerHTML =
      `<h1>잡 레이더</h1><p class="empty">데이터를 불러오지 못했다 — ${esc(e.message)}.
       루틴이 아직 한 번도 돌지 않았거나 배포가 밀렸을 수 있다.</p>`;
  });
</script>
</body>
</html>
